plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.zoomcamera.petalamazic'
    compileSdk 35

    defaultConfig {
        //applicationId "com.amazic.petalamazic"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lint {
        disable "NullSafeMutableLiveData"
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.github.DuongNT3012'
            artifactId = 'com.amazic.petalamazic'
            version = '1.0.0'

            afterEvaluate {
                from components.release
            }
        }
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    //shimmer fb
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    //
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1'
    implementation 'com.airbnb.android:lottie:6.6.6'
    //Petal
    implementation 'com.huawei.hms:ads-prime:3.4.78.301'
    implementation 'com.huawei.hms:ads-omsdk:1.3.35'//Theo doi hieu qua ads
    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'com.huawei.agconnect:agconnect-core:1.9.3.301'
    implementation 'com.huawei.agconnect:agconnect-remoteconfig:1.9.3.301'
    implementation 'com.huawei.agconnect:agconnect-remoteconfig-ktx:1.9.1.300'
}