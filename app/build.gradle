plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.huawei.agconnect'
}

android {
    namespace 'com.zoomcamera.x30zoom.hdcamera'
    compileSdk 35

    defaultConfig {
        applicationId "com.zoomcamera.x30zoom.hdcamera"
        minSdk 24
        targetSdk 35
        versionCode 100
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lint {
        disable "NullSafeMutableLiveData"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
        viewBinding true
        dataBinding true
        buildConfig true
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.appcompat
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
    //Petal
    implementation project(":petalamazic")
    implementation 'com.huawei.hms:ads-prime:3.4.78.301'
    implementation 'com.huawei.hms:ads-omsdk:1.3.35'//Theo doi hieu qua ads

    implementation 'com.huawei.agconnect:agconnect-crash:1.9.3.301'
    //implementation 'com.huawei.agconnect:agconnect-apms:1.6.3.300'

    //hms core
    implementation 'com.huawei.hms:hwid:5.0.1.301'
    implementation 'com.huawei.hms:hmscoreinstaller:6.6.0.300'
}